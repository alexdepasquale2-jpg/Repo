<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ORT runtime check</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      // Mirrors src/ai/pipelines.worker.ts: same wasmPaths shape, same backend
      // probe. If this page runs a graph, the runtime setup is sound and any
      // remaining pipeline failure is about fetching model weights, not ORT.
      import * as ort from 'onnxruntime-web';

      const log = [];
      const say = (k, v) => {
        log.push(`${k}: ${v}`);
        document.getElementById('out').textContent = log.join('\n');
      };

      async function probeAdapter() {
        if (!navigator.gpu) return 'none';
        try {
          return (await navigator.gpu.requestAdapter()) ? 'yes' : 'null';
        } catch (e) {
          return `throws(${e.message})`;
        }
      }

      (async () => {
        try {
          const adapter = await probeAdapter();
          say('crossOriginIsolated', self.crossOriginIsolated);
          say('sharedArrayBuffer', typeof SharedArrayBuffer !== 'undefined');
          say('webgpu.api', Boolean(navigator.gpu));
          say('webgpu.adapter', adapter);

          const backend = adapter === 'yes' ? 'webgpu' : 'wasm';
          say('backend', backend);

          ort.env.wasm.wasmPaths = {
            wasm: new URL('/ort/ort-wasm-simd-threaded.jsep.wasm', location.origin).href,
          };

          const session = await ort.InferenceSession.create('/verify/tiny.onnx', {
            executionProviders: [backend],
          });
          say('session', 'created');

          const input = new ort.Tensor('float32', Float32Array.from([42]), [1]);
          const result = await session.run({ x: input });
          const value = result.y.data[0];

          say('output', value);
          say('RESULT', value === 42 ? 'PASS' : `FAIL (expected 42, got ${value})`);
        } catch (err) {
          say('RESULT', `FAIL ${err && err.message ? err.message : String(err)}`);
        }
      })();
    </script>
  </body>
</html>
